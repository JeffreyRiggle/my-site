<html>
    <head>
        <title>Interstate Scene | ilusr</title>
        <style>
            body {
                margin: 0;
            }
        </style>
        <link rel="icon" href="/favicon-32x32.png" type="image/png">
        <script type="text/javascript">
            addEventListener('load', () => {
                const ground = document.createElement('img');
                ground.src = './grass.png';
                // summer fog #9dcafa
                // desert fog #ffb8ad
                const fogColor = '#9dcafa';

                const road = document.createElement('img');
                road.src = './roadv2.png';
                const streetLight = document.createElement('img');
                streetLight.src = './streetlight.png';
                const tree = document.createElement('img');
                tree.src = './tree-summer.png';

                const hud = document.createElement('img');
                hud.src = './car-hud.png';

                let events = [
                    // { z: 2, event: 'curve', direction: 'left', segments: 100, amplitude: .5 },
                    // { z: 150, event: 'curve', direction: 'right', segments: 100, amplitude: .25 },
                    // { z: 300, event: 'curve', direction: 'right', segments: 50, amplitude: .5 },
                    { z: 150, event: 'hill', direction: 'down', segments: 50, amplitude: 1 },
                    { z: 205, event: 'hill', direction: 'up', segments: 75, amplitude: 1 },
                    { z: 320, event: 'hill', direction: 'up', segments: 50, amplitude: 2 },
                    { z: 425, event: 'hill', direction: 'down', segments: 175, amplitude: 2 },
                    { z: 450, event: 'curve', direction: 'left', segments: 50, amplitude: .2 }
                ];

                // Multiply streetlight by 25 and forest by 12 to better size images
                let entities = [
                    // streetlight right
                    { z: 100, sprite: streetLight, xRel: 5, width: 32 * 25, height: 64 * 25 },
                    { z: 125, sprite: streetLight, xRel: 5, width: 32 * 25, height: 64 * 25 },
                    { z: 150, sprite: streetLight, xRel: 5, width: 32 * 25, height: 64 * 25 },
                    { z: 175, sprite: streetLight, xRel: 5, width: 32 * 25, height: 64 * 25 },
                    // streetlight left
                    { z: 100, sprite: streetLight, xRel: 5, isLHS: true, width: 32 * 25, height: 64 * 25 },
                    { z: 125, sprite: streetLight, xRel: 5, isLHS: true, width: 32 * 25, height: 64 * 25 },
                    { z: 150, sprite: streetLight, xRel: 5, isLHS: true, width: 32 * 25, height: 64 * 25 },
                    { z: 175, sprite: streetLight, xRel: 5, isLHS: true, width: 32 * 25, height: 64 * 25 },
                    // forest right
                    { z: 110, sprite: tree, xRel: 15 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 111, sprite: tree, xRel: 75 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 110, sprite: tree, xRel: 140 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 115, sprite: tree, xRel: 17 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 116, sprite: tree, xRel: 77 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 115, sprite: tree, xRel: 143 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 121, sprite: tree, xRel: 15 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 120, sprite: tree, xRel: 75 * 12, width: 64 * 12, height: 127 * 12 },
                    { z: 121, sprite: tree, xRel: 140 * 12, width: 64 * 12, height: 127 * 12 },
                    // forest left
                    { z: 55, sprite: tree, xRel: 15 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 56, sprite: tree, xRel: 75 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 55, sprite: tree, xRel: 140 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 60, sprite: tree, xRel: 17 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 61, sprite: tree, xRel: 77 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 60, sprite: tree, xRel: 143 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 66, sprite: tree, xRel: 15 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 65, sprite: tree, xRel: 75 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                    { z: 66, sprite: tree, xRel: 140 * 12, isLHS: true, width: 64 * 12, height: 127 * 12 },
                ];

                const canvas = document.getElementById('view');
                const context = canvas.getContext('2d');
                const canvasWidth = canvas.width = window.innerWidth;
                const canvasHeight = canvas.height = window.innerHeight;
                const canvasMiddle = canvasWidth / 2;
                const maxLeftX = (canvasWidth / 2) - 10;
                const minRightX = (canvasWidth / 2) + 10;
                const horizon = canvasHeight / 3;
                const roadDistance = canvasHeight - horizon;
                const maxRoadWidth = canvasWidth - (canvasWidth / 4);
                const segments = Math.ceil(roadDistance);
                let segmentMiddle = new Array(segments);

                let worldHeight = [0];
                let worldDy = 0;
                let lastHeightZ = 0;
                let segmentHeight = new Array(segments);

                function getCurve(z) {
                    let activeEvent = events.find(e => e.event === 'curve' && e.z < z && z <= (e.z + e.segments));
                    
                    if (!activeEvent) return 0;

                    return activeEvent.direction === 'left' ? -activeEvent.amplitude : activeEvent.amplitude;
                }

                function getHill(z) {
                    let activeEvent = events.find(e => e.event === 'hill' && e.z < z && z <= (e.z + e.segments));
                    
                    if (!activeEvent) return 0;

                    return activeEvent.direction === 'down' ? -activeEvent.amplitude : activeEvent.amplitude;
                }

                // This is almost certainly a problem as its a memory leak
                function fillHeights(endZ) {
                    for (let z = lastHeightZ + 1; z <= endZ; z++) {
                        worldDy += getHill(z);
                        worldHeight[z] = worldHeight[z - 1] + worldDy;
                        lastHeightZ = z;
                    }
                }

                function fillPositions(currentZ, endZ) {
                    let x = canvasMiddle;
                    let dx = 0;

                    let y = 0;
                    let dy = 0;

                    for (let i = currentZ; i <= endZ; i++) {
                        dx += getCurve(i);
                        x += dx;
                        segmentMiddle[i - currentZ] = x;

                        dy += getHill(i);
                        y += dy;
                        segmentHeight[i - currentZ] = y;
                    }
                }

                function projectY(cameraOffset, currentSegment, cameraRoadY) {
                    const projectedY = new Array(segments);
                    let terrainTopY = canvasHeight;
                    for (let i = 0; i < segments; i++) {
                        const z = (i + 1) - cameraOffset;
                        const worldY = worldHeight[currentSegment + (i + 1)];

                        // Get rid of aliasing problem with partial pixel values by using ceil.
                        projectedY[i] =
                            Math.ceil(horizon +
                            (roadDistance + cameraRoadY - worldY) / z);

                        terrainTopY = Math.min(
                            terrainTopY,
                            projectedY[i]
                        );
                    }
                    return { terrainTopY, projectedY };
                }

                let cameraPosition = 0;
                let lastFameTime = 0;
                let frameCount = 0;
                let fps = 0;

                function updateCameraPostion() {
                    cameraPosition += .05;
                }

                function runLoop() {
                    requestAnimationFrame(() => {
                        updateCameraPostion();
                        const currentSegment = Math.floor(cameraPosition);
                        const cameraOffset = cameraPosition % 1;
                        fillPositions(currentSegment, currentSegment + roadDistance);
                        fillHeights(currentSegment + segments);
                        const cameraRoadY = worldHeight[currentSegment] + (worldHeight[currentSegment + 1] - worldHeight[currentSegment]) * cameraOffset;
                        const { terrainTopY, projectedY } = projectY(cameraOffset, currentSegment, cameraRoadY);

                        // sky
                        context.clearRect(0, 0, canvasWidth, canvasHeight);
                        context.beginPath();
                        context.fillStyle = 'blue';
                        context.rect(0, 0, canvasWidth, canvasHeight);
                        context.fill();

                        // Ground
                        context.beginPath();
                        const groundPattern1 = context.createPattern(ground, 'repeat');
                        const matrix1 = new DOMMatrix().translate(-32 * cameraOffset, 32 * cameraOffset);
                        groundPattern1?.setTransform(matrix1);
                        context.fillStyle = groundPattern1;
                        context.fillRect(
                            0,
                            terrainTopY,
                            canvasWidth / 2,
                            canvasHeight - terrainTopY
                        );
                        context.fill();

                        context.beginPath();
                        const groundPattern2 = context.createPattern(ground, 'repeat');
                        const matrix2 = new DOMMatrix().translate(32 * cameraOffset, 32 * cameraOffset);
                        groundPattern2?.setTransform(matrix2);
                        context.fillStyle = groundPattern2;
                        context.fillRect(
                            canvasWidth / 2,
                            terrainTopY,
                            canvasWidth,
                            canvasHeight - terrainTopY
                        );
                        context.fill();

                        for (let i = segments - 1; i > 0; i--) {
                            let bottomZ = i - cameraOffset;
                            let topZ = i + 1 - cameraOffset;
                            let bottomMiddle = segmentMiddle[i - 1];
                            let topMiddle = segmentMiddle[i];
                            
                            let leftX1 = bottomMiddle - (maxRoadWidth / bottomZ);
                            let leftX2 = topMiddle - (maxRoadWidth / topZ);
                            let rightX1 = bottomMiddle + (maxRoadWidth / bottomZ);
                            let rightX2 = topMiddle + (maxRoadWidth / topZ);

                            let bottomY = projectedY[i - 1];
                            let topY = projectedY[i];

                            // Avoid clipping issue near the bottom.
                            // Since the camera can end up in a weird place
                            // during movement it can cause the trapezoid not to
                            // properly render at the bottom of the screen.
                            if (i === 1) {
                                const t = (canvasHeight - topY) / (bottomY - topY);
                                bottomY = canvasHeight;
                                leftX1 = leftX2 + (leftX1 - leftX2) * t;
                                rightX1 = rightX2 + (rightX1 - rightX2) * t;
                            }

                            // Fill road
                            context.fillStyle = context.createPattern(road, 'repeat');;
                            context.beginPath();
                            context.moveTo(leftX1, bottomY);
                            context.lineTo(leftX2, topY);
                            context.lineTo(rightX2, topY);
                            context.lineTo(rightX1, bottomY);
                            context.lineTo(leftX1, bottomY);
                            context.fill();

                            const releventEntities = entities.filter(e => e.z === Math.floor(i + currentSegment));
                            if (releventEntities.length) {
                                const worldY = worldHeight[currentSegment + (i + 1)];
                                for (let entity of releventEntities) {
                                    const entityZ = entity.z - currentSegment;
                                    const scale = 1 / entityZ;
                                    const entityWidth = scale * entity.width;
                                    const entityHeight = scale * entity.height;
                                    const entityX = entity.isLHS ? leftX1 - (entity.xRel * scale) - entityWidth :  rightX1 + (entity.xRel * scale);

                                    const entityY =
                                        Math.ceil(horizon +
                                            (roadDistance + cameraRoadY - worldY) / entityZ) - entityHeight;

                                    if (entity.isLHS) {
                                        context.save();
                                        context.translate(entityX + entityWidth, entityY);
                                        context.scale(-1, 1);
                                        context.drawImage(
                                            entity.sprite,
                                            0,
                                            0,
                                            entityWidth,
                                            entityHeight);
                                        context.restore();
                                    } else {
                                        context.drawImage(
                                            entity.sprite,
                                            entityX,
                                            entityY,
                                            entityWidth,
                                            entityHeight);
                                    }
                                }
                            }

                            // Fill left line
                            context.fillStyle = 'white';
                            context.beginPath();
                            context.moveTo(leftX1 + 1, bottomY);
                            context.lineTo(leftX2 + 1, topY);
                            context.lineTo(leftX2 + 2, topY);
                            context.lineTo(leftX1 + 2, bottomY);
                            context.fill();

                            // Fill right line
                            context.fillStyle = 'white';
                            context.beginPath();
                            context.moveTo(rightX1 - 1, bottomY);
                            context.lineTo(rightX2 - 1, topY);
                            context.lineTo(rightX2 - 2, topY);
                            context.lineTo(rightX1 - 2, bottomY);
                            context.fill();

                            // optional fill dashed yellow
                            if ((currentSegment + i) % 2 == 0) continue;

                            context.fillStyle = 'white';
                            context.beginPath();
                            context.moveTo(bottomMiddle - 1, bottomY);
                            context.lineTo(topMiddle - 1, topY);
                            context.lineTo(topMiddle + 1, topY);
                            context.lineTo(bottomMiddle + 1, bottomY);
                            context.lineTo(bottomMiddle - 1, bottomY);
                            context.fill();

                            if (topY >= bottomY || topY < terrainTopY) continue;

                            const fogDensity = 1 / Math.pow(Math.E, (i / segments) * (i / segments) * 5);
                            if (fogDensity < 1) {
                                context.globalAlpha = 1 - fogDensity;
                                context.fillStyle = fogColor;
                                context.fillRect(0, topY, canvasWidth, bottomY - topY);
                                context.globalAlpha = 1;
                            }
                        }

                        context.drawImage(
                            hud,
                            0,
                            0,
                            canvasWidth,
                            canvasHeight);

                        frameCount++;
                        const now = performance.now();

                        if (now - lastFameTime >= 1000) {
                            fps = Math.round((frameCount * 1000) / (now - lastFameTime));
                            frameCount = 0;
                            lastFameTime = now;
                        }

                        context.fillStyle = 'black';
                        context.font = "24px 'Courier New', Courier, monospace";
                        // TODO make these numbers work on more screen resolutions
                        context.fillText(`FPS: ${fps}`, 300, canvasHeight - 175);

                        runLoop();
                    })
                }

                runLoop();
            });
        </script>
    </head>
    <body>
        <canvas id="view"></canvas>
    </body>
</html>
