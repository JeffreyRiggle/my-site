<html>
    <head>
        <title>Digital Road Scene | ilusr</title>
        <style>
            body {
                margin: 0;
                background-color: black;
            }
        </style>
        <link rel="icon" href="/favicon-32x32.png" type="image/png">
        <script type="text/javascript">
            addEventListener('load', () => {
                let canvas = document.getElementById('canvas');
                let context = canvas.getContext('2d');

                const canvasWidth = canvas.width = window.innerWidth;
                const canvasHeight = canvas.height = window.innerHeight;
                const canvasMiddle = canvasWidth / 2;
                const horizon = canvasHeight / 2;
                const roadDistance = canvasHeight - horizon;
                const maxRoadWidth = canvasWidth / 2;
                const cameraX = 0;
                const segments = Math.round(roadDistance);
                const worldHeight = [0];

                let cameraPosition = 0;
                let lastHeightFill = 0;
                let worldDy = 0;
                let pulses = [];
                let wave;
                let lastTimeStep, nextPulseGeneration, waveGeneration;

                // I think this can be removed since we don't have hills.
                function fillHeights(currentZ, endZ) {
                    if (worldHeight.length === 1) {
                        lastHeightFill = currentZ;
                        for (let z = currentZ; z <= endZ; z++) {
                            worldDy += 0;
                            worldHeight[z - currentZ] = (z === currentZ ? worldHeight.at(-1) : worldHeight[z - currentZ - 1]) + worldDy;
                        }
                    } else if (lastHeightFill !== currentZ) {
                        lastHeightFill = currentZ;
                        worldHeight.shift();
                        worldDy += 0;
                        worldHeight.push(worldHeight.at(-1) + worldDy);
                    }
                }

                // TODO simplify this
                function projectY(cameraOffset, currentSegment, cameraRoadY) {
                    const projectedY = new Array(segments);
                    const clipY = new Array(segments);
                    let terrainTopY = canvasHeight;

                    for (let i = 0; i < segments; i++) {
                        const z = (i + 1) - cameraOffset;
                        const worldY = worldHeight[i + 1];

                        // Get rid of aliasing problem with partial pixel values by using ceil.
                        projectedY[i] =
                            Math.ceil(horizon +
                            (roadDistance + cameraRoadY - worldY) / z);

                        terrainTopY = Math.min(
                            terrainTopY,
                            projectedY[i]
                        );

                        clipY[i] = terrainTopY;
                    }
                    return { terrainTopY, projectedY, clipY };
                }

                // TODO make this better this time
                function updateCameraPostion() {
                    cameraPosition += .01;
                }

                function projectPoint(z, worldX, worldY, cameraRoadY) {
                    return { 
                        x: canvasMiddle + (worldX - cameraX) / z,
                        y: horizon + (roadDistance + cameraRoadY - worldY) / z
                    };
                }

                function worldYAt(z) {
                    const i = Math.floor(z);
                    const t = z - i;

                    return worldHeight[i] +
                        (worldHeight[i + 1] - worldHeight[i]) * t;
                }

                function run() {
                    requestAnimationFrame((timestep) => {
                        let dt = timestep - (lastTimeStep ?? timestep);
                        lastTimeStep = timestep;

                        if (dt === 0) {
                            nextPulseGeneration = timestep + Math.round(Math.random() * 5000);
                            waveGeneration = timestep + (Math.ceil(Math.random() * 5) * 3000);
                        }

                        if (nextPulseGeneration <= timestep) {
                            pulses.push({ z: -5, length: 5 });
                            nextPulseGeneration = timestep + (Math.ceil(Math.random() * 5) * 1000);
                        }

                        if (waveGeneration <= timestep) {
                            wave = { frequency: 10, amplitude: 20, acceleration: .01, ttl: 3000 };
                            waveGeneration = timestep + (Math.ceil(Math.random() * 5) * 3000);
                        }
                        
                        if (wave) {
                            wave.ttl -= dt;

                            if (wave.ttl <= 0) {
                                wave = null;
                            } else {
                                wave.amplitude += wave.acceleration * dt; 
                            }
                        }

                        for (let pulse of pulses) {
                            pulse.z += .05;
                        }

                        pulses = pulses.filter(p => p.z < segments);
                        updateCameraPostion();
                        const currentSegment = Math.floor(cameraPosition);
                        const cameraOffset = cameraPosition % 1;
                        fillHeights(currentSegment, currentSegment + segments);
                        const cameraRoadY = worldHeight[0] + (worldHeight[1] - worldHeight[0]) * cameraOffset;
                        const { terrainTopY, projectedY, clipY } = projectY(cameraOffset, currentSegment, cameraRoadY);

                        context.clearRect(0, 0, canvasWidth, canvasHeight);

                        for (let i = segments - 1; i > 0; i--) {
                            let bottomZ = i - cameraOffset;
                            let topZ = i + 1 - cameraOffset;

                            let bottomY = projectedY[i - 1];
                            let topY = projectedY[i];
                            
                            let leftX1; 
                            let leftX2;
                            let rightX1;
                            let rightX2;
                            
                            if (wave) {
                                let leftBottomMiddle = canvasMiddle + Math.cos((i - 1) * wave.frequency) * wave.amplitude;
                                let rightBottomMiddle = canvasMiddle + Math.sin((i - 1) * wave.frequency) * wave.amplitude;
                                let leftTopMiddle = canvasMiddle + Math.cos(i * wave.frequency) * wave.amplitude;
                                let rightTopMiddle = canvasMiddle + Math.sin(i * wave.frequency) * wave.amplitude;

                                leftX1 = leftBottomMiddle - (maxRoadWidth / bottomZ);
                                leftX2 = leftTopMiddle - (maxRoadWidth / topZ);
                                rightX1 = rightBottomMiddle + (maxRoadWidth / bottomZ);
                                rightX2 = rightTopMiddle + (maxRoadWidth / topZ);
                            } else {
                                let bottomMiddle = canvasMiddle - cameraX / bottomZ;
                                let topMiddle = canvasMiddle - cameraX / topZ;

                                leftX1 = bottomMiddle - (maxRoadWidth / bottomZ);
                                leftX2 = topMiddle - (maxRoadWidth / topZ);
                                rightX1 = bottomMiddle + (maxRoadWidth / bottomZ);
                                rightX2 = topMiddle + (maxRoadWidth / topZ);
                            }

                            // Avoid clipping issue near the bottom.
                            // Since the camera can end up in a weird place
                            // during movement it can cause the trapezoid not to
                            // properly render at the bottom of the screen.
                            if (i === 1) {
                                const t = (canvasHeight - topY) / (bottomY - topY);
                                bottomY = canvasHeight;
                                leftX1 = leftX2 + (leftX1 - leftX2) * t;
                                rightX1 = rightX2 + (rightX1 - rightX2) * t;
                            }

                            context.strokeStyle = 'green';
                            context.lineWidth = 1;
                            context.beginPath();
                            context.moveTo(0, bottomY);
                            context.lineTo(leftX1, bottomY);
                            context.stroke();
                            context.lineWidth = 5;
                            context.beginPath();
                            context.moveTo(leftX1, bottomY)
                            context.lineTo(leftX2, topY);
                            context.stroke();
                            context.lineWidth = 1;
                            context.beginPath();
                            context.moveTo(leftX2, topY)
                            context.lineTo(0, topY);
                            context.stroke();

                            context.beginPath();
                            context.moveTo(canvasWidth, bottomY);
                            context.lineTo(rightX1, bottomY);
                            context.stroke();
                            context.lineWidth = 5;
                            context.beginPath();
                            context.moveTo(rightX1, bottomY);
                            context.lineTo(rightX2, topY);
                            context.stroke();
                            context.lineWidth = 1;
                            context.beginPath();
                            context.moveTo(rightX2, topY);
                            context.lineTo(canvasWidth, topY);
                            context.stroke();
                        }

                        for (let pulse of pulses) {
                                const pulseStart = Math.max(cameraOffset, pulse.z);
                                const pulseEnd = pulse.z + pulse.length;
                                const relativePulseStart = pulseStart - cameraOffset;
                                const relativePulseEnd = pulseEnd - cameraOffset;

                                if (relativePulseEnd <= 0) continue;

                                const pulseBottomLeft = projectPoint(relativePulseStart, -maxRoadWidth, worldYAt(pulseStart), cameraRoadY);
                                const pulseTopLeft = projectPoint(relativePulseEnd, -maxRoadWidth, worldYAt(pulseEnd), cameraRoadY);
                                
                                context.strokeStyle = 'lightgreen';
                                context.lineWidth = 5;
                                context.beginPath();
                                context.moveTo(pulseBottomLeft.x, pulseBottomLeft.y);
                                context.lineTo(pulseTopLeft.x, pulseTopLeft.y);
                                context.stroke();
                                
                                const pulseBottomRight = projectPoint(relativePulseStart, maxRoadWidth, worldYAt(pulseStart), cameraRoadY);
                                const pulseTopRight = projectPoint(relativePulseEnd, maxRoadWidth, worldYAt(pulseEnd), cameraRoadY);
                                
                                context.beginPath();
                                context.moveTo(pulseBottomRight.x, pulseBottomRight.y);
                                context.lineTo(pulseTopRight.x, pulseTopRight.y);
                                context.stroke();
                            }

                        run();
                    });
                }
                run();
            });
        </script>
    </head>
    <body>
        <canvas id="canvas"></canvas>
    </body>
</html>
