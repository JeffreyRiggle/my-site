<html>
    <head>
        <title>Digital Road Scene | ilusr</title>
        <style>
            body {
                margin: 0;
                background-color: black;
            }
        </style>
        <link rel="icon" href="/favicon-32x32.png" type="image/png">
        <script type="text/javascript">
            addEventListener('load', () => {
                let canvas = document.getElementById('canvas');
                let context = canvas.getContext('2d');

                const canvasWidth = canvas.width = window.innerWidth;
                const canvasHeight = canvas.height = window.innerHeight;
                const canvasMiddle = canvasWidth / 2;
                const horizon = canvasHeight / 2;
                const roadDistance = canvasHeight - horizon;
                const maxRoadWidth = canvasWidth / 2;
                const cameraX = 0;
                const segments = Math.round(roadDistance);
                const worldHeight = [0];

                let cameraPosition = 0;
                let lastHeightFill = 0;
                let worldDy = 0;
                let pulses = [];
                let wave;
                let lastTimeStep, nextPulseGeneration, waveGeneration;

                // I think this can be removed since we don't have hills.
                function fillHeights(currentZ, endZ) {
                    if (worldHeight.length === 1) {
                        lastHeightFill = currentZ;
                        for (let z = currentZ; z <= endZ; z++) {
                            worldDy += 0;
                            worldHeight[z - currentZ] = (z === currentZ ? worldHeight.at(-1) : worldHeight[z - currentZ - 1]) + worldDy;
                        }
                    } else if (lastHeightFill !== currentZ) {
                        lastHeightFill = currentZ;
                        worldHeight.shift();
                        worldDy += 0;
                        worldHeight.push(worldHeight.at(-1) + worldDy);
                    }
                }

                // TODO simplify this
                function projectY(cameraOffset, cameraRoadY) {
                    const projectedY = new Array(segments);

                    for (let i = 0; i < segments; i++) {
                        const z = (i + 1) - cameraOffset;
                        const worldY = worldHeight[i + 1];

                        // Get rid of aliasing problem with partial pixel values by using ceil.
                        projectedY[i] =
                            Math.ceil(horizon +
                            (roadDistance + cameraRoadY - worldY) / z);
                    }
                    return projectedY;
                }

                // TODO make this better this time
                function updateCameraPostion() {
                    cameraPosition += .01;
                }

                function projectPoint(z, worldX, worldY, cameraRoadY) {
                    return { 
                        x: canvasMiddle + (worldX - cameraX) / z,
                        y: horizon + (roadDistance + cameraRoadY - worldY) / z
                    };
                }

                function worldYAt(z) {
                    const i = Math.floor(z);
                    const t = z - i;

                    return worldHeight[i] +
                        (worldHeight[i + 1] - worldHeight[i]) * t;
                }

                function run() {
                    requestAnimationFrame((timestep) => {
                        let dt = timestep - (lastTimeStep ?? timestep);
                        lastTimeStep = timestep;

                        if (dt === 0) {
                            nextPulseGeneration = timestep + Math.round(Math.random() * 5000);
                            waveGeneration = timestep + (Math.ceil(Math.random() * 5) * 3000);
                        }

                        if (nextPulseGeneration <= timestep) {
                            pulses.push({ z: -5, length: 5 });
                            nextPulseGeneration = timestep + (Math.ceil(Math.random() * 5) * 1000);
                        }

                        if (waveGeneration <= timestep) {
                            wave = { frequency: Math.random() * .1, amplitude: Math.ceil(Math.random() * 10), acceleration: Math.random() * .05, ttl: 1000 };
                            waveGeneration = timestep + (Math.ceil(Math.random() * 5) * 3000);
                        }
                        
                        if (wave) {
                            wave.ttl -= dt;

                            if (wave.ttl <= 0) {
                                wave = null;
                            } else {
                                wave.amplitude += wave.acceleration * dt; 
                            }
                        }

                        for (let pulse of pulses) {
                            pulse.z += .05;
                        }

                        pulses = pulses.filter(p => p.z < segments);
                        updateCameraPostion();
                        const currentSegment = Math.floor(cameraPosition);
                        const cameraOffset = cameraPosition % 1;
                        fillHeights(currentSegment, currentSegment + segments);
                        const cameraRoadY = worldHeight[0] + (worldHeight[1] - worldHeight[0]) * cameraOffset;
                        const projectedY = projectY(cameraOffset, cameraRoadY);

                        context.clearRect(0, 0, canvasWidth, canvasHeight);

                        for (let i = canvasHeight; i > horizon; i--) {
                            const z = roadDistance / (i - horizon);
                            const segment = Math.floor(z);
                            const segmentOffset = z - segment;
                            let left, right;
                            
                            if (wave) {
                                const leftMiddle = canvasMiddle + Math.cos(i * wave.frequency) * wave.amplitude;
                                const rightMiddle = canvasMiddle + Math.sin(i * wave.frequency) * wave.amplitude;
                                left = leftMiddle - (maxRoadWidth / z);
                                right = rightMiddle + (maxRoadWidth / z);
                            } else {
                                const roadMiddle = canvasMiddle - cameraX / z;
                                left = roadMiddle - (maxRoadWidth / z);
                                right = roadMiddle + (maxRoadWidth / z);
                            }

                            // TODO I want to find a better way to do this.
                            const onSegment = projectedY.some(y => y === i);
                            context.beginPath();
                            context.moveTo(!onSegment ? left : 0, i);
                            context.lineTo(left + 5, i);
                            context.moveTo(right, i);
                            context.lineTo(!onSegment ? right + 5 : canvasWidth, i);
                            context.strokeStyle = 'green';
                            context.lineWidth = 1;
                            context.stroke();
                        }

                        for (let pulse of pulses) {
                                const pulseStart = Math.max(cameraOffset, pulse.z);
                                const pulseEnd = pulse.z + pulse.length;
                                const relativePulseStart = pulseStart - cameraOffset;
                                const relativePulseEnd = pulseEnd - cameraOffset;

                                if (relativePulseEnd <= 0) continue;

                                const pulseBottomLeft = projectPoint(relativePulseStart, -maxRoadWidth, worldYAt(pulseStart), cameraRoadY);
                                const pulseTopLeft = projectPoint(relativePulseEnd, -maxRoadWidth, worldYAt(pulseEnd), cameraRoadY);
                                
                                context.strokeStyle = 'lightgreen';
                                context.lineWidth = 5;
                                context.beginPath();
                                context.moveTo(pulseBottomLeft.x, pulseBottomLeft.y);
                                context.lineTo(pulseTopLeft.x, pulseTopLeft.y);
                                context.stroke();
                                
                                const pulseBottomRight = projectPoint(relativePulseStart, maxRoadWidth, worldYAt(pulseStart), cameraRoadY);
                                const pulseTopRight = projectPoint(relativePulseEnd, maxRoadWidth, worldYAt(pulseEnd), cameraRoadY);
                                
                                context.beginPath();
                                context.moveTo(pulseBottomRight.x, pulseBottomRight.y);
                                context.lineTo(pulseTopRight.x, pulseTopRight.y);
                                context.stroke();
                            }

                        run();
                    });
                }
                run();
            });
        </script>
    </head>
    <body>
        <canvas id="canvas"></canvas>
    </body>
</html>
