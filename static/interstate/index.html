<html>
    <head>
        <title>Interstate Scene | ilusr</title>
        <style>
            body {
                margin: 0;
            }
        </style>
        <link rel="icon" href="/favicon-32x32.png" type="image/png">
        <script type="text/javascript">
            addEventListener('load', () => {
                let events = [
                    { z: 2, event: 'curve', direction: 'left', segments: 100, amplitude: .5 },
                    { z: 150, event: 'curve', direction: 'right', segments: 100, amplitude: .25 },
                    { z: 300, event: 'curve', direction: 'right', segments: 50, amplitude: .5 }
                ];

                const canvas = document.getElementById('view');
                const context = canvas.getContext('2d');
                const canvasWidth = canvas.width = window.innerWidth;
                const canvasHeight = canvas.height = window.innerHeight;
                const canvasMiddle = canvasWidth / 2;
                const maxLeftX = (canvasWidth / 2) - 10;
                const minRightX = (canvasWidth / 2) + 10;
                const horizon = canvasHeight / 3;
                const roadDistance = canvasHeight - horizon;
                const maxRoadWidth = canvasWidth - (canvasWidth / 4);
                let segmentMiddle = new Array(Math.ceil(roadDistance));

                function getCurve(z) {
                    let activeEvent = events.find(e => e.z < z && z <= (e.z + e.segments));
                    
                    if (!activeEvent) return 0;

                    return activeEvent.direction === 'left' ? -activeEvent.amplitude : activeEvent.amplitude;
                }

                function fillPositions(currentZ, endZ) {
                    let x = canvasMiddle;
                    let dx = 0;

                    for (let i = currentZ; i <= endZ; i++) {
                        dx += getCurve(i);
                        x += dx;
                        segmentMiddle[i - currentZ] = x;
                    }
                }

                let cameraPosition = 0;

                function updateCameraPostion() {
                    cameraPosition += .1;
                }

                function runLoop() {
                    requestAnimationFrame(() => {
                        updateCameraPostion();
                        // sky
                        context.clearRect(0, 0, canvasWidth, canvasHeight);
                        context.beginPath();
                        context.fillStyle = 'blue';
                        context.rect(0, 0, canvasWidth, canvasHeight);
                        context.fill();

                        // ground
                        context.beginPath();
                        context.fillStyle = 'green';
                        context.rect(0, canvasHeight / 3, canvasWidth, canvasHeight);
                        context.fill();

                        const currentSegment = Math.floor(cameraPosition);
                        fillPositions(currentSegment, currentSegment + roadDistance);
                        const cameraOffset = cameraPosition % 1
                        
                        for (let i = 1; i <= roadDistance; i++) {;
                            let bottomZ = i - cameraOffset;
                            let topZ = i + 1 - cameraOffset;
                            let bottomMiddle = segmentMiddle[i];
                            let topMiddle = segmentMiddle[i + 1];
                            
                            let leftX1 = bottomMiddle - (maxRoadWidth / bottomZ);
                            let leftX2 = topMiddle - (maxRoadWidth / topZ);
                            let rightX1 = bottomMiddle + (maxRoadWidth / bottomZ);
                            let rightX2 = topMiddle + (maxRoadWidth / topZ);

                            let bottomY = horizon + roadDistance / bottomZ;
                            let topY = horizon + roadDistance / topZ;

                            // Fill road
                            context.fillStyle = 'grey';
                            context.beginPath();
                            context.moveTo(leftX1, bottomY);
                            context.lineTo(leftX2, topY);
                            context.lineTo(rightX2, topY);
                            context.lineTo(rightX1, bottomY);
                            context.lineTo(leftX1, bottomY);
                            context.fill();

                            // Fill left line
                            context.fillStyle = 'white';
                            context.beginPath();
                            context.moveTo(leftX1 + 1, bottomY);
                            context.lineTo(leftX2 + 1, topY);
                            context.lineTo(leftX2 + 2, topY);
                            context.lineTo(leftX1 + 2, bottomY);
                            context.fill();

                            // Fill right line
                            context.fillStyle = 'white';
                            context.beginPath();
                            context.moveTo(rightX1 - 1, bottomY);
                            context.lineTo(rightX2 - 1, topY);
                            context.lineTo(rightX2 - 2, topY);
                            context.lineTo(rightX1 - 2, bottomY);
                            context.fill();

                            // optional fill dashed yellow
                            if ((currentSegment + i) % 2 == 0) continue;

                            context.fillStyle = 'white';
                            context.beginPath();
                            context.moveTo(bottomMiddle - 1, bottomY);
                            context.lineTo(topMiddle - 1, topY);
                            context.lineTo(topMiddle + 1, topY);
                            context.lineTo(bottomMiddle + 1, bottomY);
                            context.lineTo(bottomMiddle - 1, bottomY);
                            context.fill();
                        }
                        
                        runLoop();
                    })
                }

                runLoop();
            });
        </script>
    </head>
    <body>
        <canvas id="view"></canvas>
    </body>
</html>
